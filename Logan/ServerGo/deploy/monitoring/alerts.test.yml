      "name": "LoganScrapeDown pending then firing",
      "interval": "1m",
      "input_series": [
        {
          "series": "up{job=\"logan-go\",instance=\"logan-go:8080\"}",
          "values": "0x35"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "0m",
          "alertname": "LoganScrapeDown",
          "exp_alerts": []
        },
        {
          "eval_time": "25m",
          "alertname": "LoganScrapeDown",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "logan-go",
                "instance": "logan-go:8080",
                "severity": "warning",
                "service": "logan-go",
                "reason": "scrape_down"
              },
              "exp_annotations": {
                "summary": "Logan metrics scrape is failing"
              }
            }
          ]
        }
      ]
    },
