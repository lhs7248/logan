global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: logan-go
    metrics_path: /metrics
    scrape_timeout: 10s
    static_configs:
      - targets: [logan-go:8080]
